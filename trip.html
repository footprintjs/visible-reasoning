/* the dual (data+instruction) callouts stack + sit up top so they fit a portrait screen */
.atui.mobile .dual-thoughts { flex-direction: column; gap: 8px; align-items: center; top: 12px !important; bottom: auto !important; left: 50% !important; }
.atui.mobile .cloud.compact, .atui.mobile .skilldoc.compact { max-width: 180px; }
:where(.atui, .atui-swarm) .tl-seg .seg-dot { position: absolute; top: -19px; left: 50%; transform: translateX(-50%); font-size: calc(14px * var(--af-text-scale)); opacity: .8; }

/* playhead */
:where(.atui, .atui-swarm) .playhead { position: absolute; top: 20px; width: 4px; height: 24px; background: var(--ink); border-radius: 3px; transform: translateX(-50%);
  transition: left .45s cubic-bezier(.4,0,.2,1); z-index: 5; box-shadow: 0 0 0 3px var(--paper); }
:where(.atui, .atui-swarm) .playhead::after { content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%); width: 13px; height: 13px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--paper); }
:where(.atui, .atui-swarm) .tl-track-wrap.scrubbing .playhead { transition: none; }

:where(.atui, .atui-swarm) .tl-controls { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
:where(.atui, .atui-swarm) .tl-btns { display: flex; align-items: center; gap: 8px; }
:where(.atui, .atui-swarm) .tl-btn { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
  display: grid; place-items: center; transition: background .15s, border-color .15s, color .15s; }
/* stable hover — tint only, NO vertical lift (the jump read as a height change) */
:where(.atui, .atui-swarm) .tl-btn:hover { background: var(--paper-2); color: var(--ink); }
/* Back / Next are how you actually step the trace → the prominent, filled pair. */
:where(.atui, .atui-swarm) .tl-btn.nav { background: var(--rust); border-color: var(--rust-deep); color: var(--on-rust, #fff); box-shadow: var(--shadow-sm); }
:where(.atui, .atui-swarm) .tl-btn.nav:hover { background: var(--rust-deep); color: var(--on-rust, #fff); }
/* Play / Restart are secondary → calm ghost buttons, same size, no fill. */
:where(.atui, .atui-swarm) .tl-btn.play { background: transparent; color: var(--ink-soft); }
:where(.atui, .atui-swarm) .tl-btn.play:hover { background: var(--paper-2); color: var(--ink); }
:where(.atui, .atui-swarm) .tl-btn svg { width: 18px; height: 18px; }

:where(.atui, .atui-swarm) .tl-readout { display: flex; align-items: center; gap: 8px; }
:where(.atui, .atui-swarm) .tl-readout .step-n { font-family: var(--font-display); font-weight: 700; font-size: calc(15px * var(--af-text-scale)); }
:where(.atui, .atui-swarm) .tl-readout .step-n span { color: var(--ink-faint); font-weight: 500; }
:where(.atui, .atui-swarm) .tl-meter { display: flex; gap: 7px; }
:where(.atui, .atui-swarm) .tl-meter .m { font-family: var(--font-mono); font-size: calc(11.5px * var(--af-text-scale)); color: var(--ink-soft); background: var(--paper-2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; }
:where(.atui, .atui-swarm) .tl-spacer { flex: 1; }
:where(.atui, .atui-swarm) .speed-group { display: flex; align-items: center; gap: 5px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
:where(.atui, .atui-swarm) .speed-group button { border: 0; background: transparent; color: var(--ink-soft); font-family: var(--font-mono); font-size: calc(12px * var(--af-text-scale)); font-weight: 700; padding: 5px 9px; border-radius: 7px; }
:where(.atui, .atui-swarm) .speed-group button.on { background: var(--card); color: var(--rust); box-shadow: var(--shadow-sm); }

:where(.atui, .atui-swarm) .legend { position: relative; display: flex; align-items: center; cursor: default; outline: none; }
/* compact trigger: 4 tiny swatches + "key" — the full legend is a hover tooltip */
:where(.atui, .atui-swarm) .legend-trigger { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper-2); border-radius: 8px; padding: 4px 9px; color: var(--ink-soft); font-family: var(--font-mono); font-size: calc(10px * var(--af-text-scale)); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
:where(.atui, .atui-swarm) .legend:hover .legend-trigger, :where(.atui, .atui-swarm) .legend:focus-within .legend-trigger { border-color: var(--ink-faint); color: var(--ink); }
:where(.atui, .atui-swarm) .legend .lk-dots { display: flex; gap: 2px; }
:where(.atui, .atui-swarm) .legend .lk-dots i { width: 8px; height: 8px; border-radius: 2px; display: block; }
/* the revealed legend — above the chip, right-aligned so it stays on-screen */
:where(.atui, .atui-swarm) .legend-pop { position: absolute; right: 0; bottom: calc(100% + 8px); display: flex; flex-direction: column; gap: 7px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow-md); white-space: nowrap; opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .15s ease, transform .15s ease, visibility .15s; z-index: 20; }
:where(.atui, .atui-swarm) .legend:hover .legend-pop, :where(.atui, .atui-swarm) .legend:focus-within .legend-pop { opacity: 1; visibility: visible; transform: none; }
:where(.atui, .atui-swarm) .legend .lg { display: flex; align-items: center; gap: 6px; font-size: calc(11.5px * var(--af-text-scale)); color: var(--ink-soft); font-weight: 600; }
:where(.atui, .atui-swarm) .legend .sw { width: 11px; height: 11px; border-radius: 4px; }

@media (max-width: 1120px) {
  :where(.atui, .atui-swarm) .shelf { width: 150px; }
}

@media (prefers-reduced-motion: reduce) {
  :where(.atui, .atui-swarm, .atui-backtrack) .brain .eyes, :where(.atui, .atui-swarm) .cloud .ctag .dots i, :where(.atui, .atui-swarm) .task-pill .rec { animation: none !important; }
  :where(.atui-backtrack) .bt-why .rec, :where(.atui-backtrack) .bt-stamp, :where(.atui-backtrack) .bt-custody li { animation: none !important; opacity: 1; }
  :where(.atui-backtrack) .bt-meter .bt-fill, :where(.atui-backtrack) .bt-meter-val, :where(.atui-backtrack) .bt-sc-note { transition: none !important; }
}

/* ---------- <MultiAgentFlow> — multi-agent map + drill-down ---------- */
.atui-swarm { height: 100%; display: flex; flex-direction: column; max-width: 1480px; margin: 0 auto; padding: 18px 26px 0; }
:where(.atui, .atui-swarm) .swarm-bar { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; flex: none; }
:where(.atui, .atui-swarm) .swarm-brand { font-family: var(--font-display); font-weight: 700; font-size: calc(19px * var(--af-text-scale)); }
:where(.atui, .atui-swarm) .swarm-task { display: flex; align-items: center; gap: 8px; font-size: calc(13.5px * var(--af-text-scale)); color: var(--ink); }
:where(.atui, .atui-swarm) .swarm-task .lbl { font-size: calc(11px * var(--af-text-scale)); text-transform: uppercase; letter-spacing: .12em; color: var(--ink-faint); font-weight: 700; }
:where(.atui, .atui-swarm) .swarm-wrap { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding-bottom: 16px; }
:where(.atui, .atui-swarm) .swarm-canvas { position: relative; }
:where(.atui, .atui-swarm) .swarm-edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
:where(.atui, .atui-swarm) .swarm-edge { stroke: var(--line); stroke-width: 2.2; }
:where(.atui, .atui-swarm) .swarm-edge.flow { stroke: var(--call); stroke-dasharray: 6 7; animation: swarmflow 1.3s linear infinite; }
@keyframes swarmflow { to { stroke-dashoffset: -26; } }
:where(.atui, .atui-swarm) .swarm-edge-head { fill: var(--call); }
:where(.atui, .atui-swarm) .swarm-edge-label { fill: var(--ink-faint); font-size: 11px; font-family: var(--font-hand); }

:where(.atui, .atui-swarm) .agent-card { position: absolute; text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 13px 15px; box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s, border-color .15s; }
:where(.atui, .atui-swarm) .agent-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--accent); }
:where(.atui, .atui-swarm) .agent-card .ac-status { position: absolute; top: 14px; right: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
:where(.atui, .atui-swarm) .agent-card.k-call .ac-status { animation: pulse 2s infinite; }
:where(.atui, .atui-swarm) .agent-card .ac-head2 { display: flex; align-items: center; gap: 11px; }
:where(.atui, .atui-swarm) .agent-card .ac-avatar { width: 46px; height: 44px; flex: none; position: relative; }
:where(.atui, .atui-swarm) .agent-card .ac-avatar .brain { transform: scale(.4); transform-origin: top left; }
:where(.atui, .atui-swarm) .agent-card .ac-avatar .brain-custom { width: 108px; height: 108px; }
:where(.atui, .atui-swarm) .agent-card .ac-id { min-width: 0; }
:where(.atui, .atui-swarm) .agent-card .ac-name { font-family: var(--font-display); font-weight: 700; font-size: calc(15px * var(--af-text-scale)); color: var(--ink); }
:where(.atui, .atui-swarm) .agent-card .ac-role { font-size: calc(11.5px * var(--af-text-scale)); color: var(--ink-soft); margin-top: 1px; }
:where(.atui, .atui-swarm) .agent-card .ac-meta { font-family: var(--font-mono); font-size: calc(10.5px * var(--af-text-scale)); color: var(--ink-faint); margin-top: 9px; }
:where(.atui, .atui-swarm) .agent-card .ac-drill { position: absolute; bottom: 12px; right: 14px; font-size: calc(11px * var(--af-text-scale)); font-weight: 700; color: var(--accent-deep); }

:where(.atui, .atui-swarm) .swarm-detailbar { gap: 12px; padding: 10px 14px; margin-bottom: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-sm); }
:where(.atui, .atui-swarm) .swarm-bar .swarm-back { border: 0; background: var(--rust); color: var(--on-rust, #fff); border-radius: 9px; padding: 7px 13px; font-weight: 700; font-size: calc(12.5px * var(--af-text-scale)); cursor: pointer; box-shadow: var(--shadow-sm); white-space: nowrap; }
:where(.atui, .atui-swarm) .swarm-bar .swarm-back:hover { background: var(--rust-deep); }
:where(.atui, .atui-swarm) .swarm-bc { display: flex; align-items: center; gap: 9px; min-width: 0; }
:where(.atui, .atui-swarm) .swarm-bc-team { border: 0; background: transparent; color: var(--ink-soft); font: inherit; font-size: calc(13px * var(--af-text-scale)); font-weight: 700; cursor: pointer; padding: 0; }
:where(.atui, .atui-swarm) .swarm-bc-team:hover { color: var(--rust); text-decoration: underline; }
:where(.atui, .atui-swarm) .swarm-sep { color: var(--ink-faint); }
:where(.atui, .atui-swarm) .swarm-here { font-family: var(--font-display); font-size: calc(14px * var(--af-text-scale)); }
:where(.atui, .atui-swarm) .swarm-role { font-size: calc(11.5px * var(--af-text-scale)); color: var(--ink-soft); background: var(--paper-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; }
:where(.atui, .atui-swarm) .swarm-bc-task { margin-left: auto; color: var(--ink-faint); font-size: calc(12px * var(--af-text-scale)); max-width: 40%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:where(.atui, .atui-swarm) .swarm-detail { flex: 1; min-height: 0; }
.swarm-detail .atui { padding: 0; height: 100%; }

/* control-flow node kinds */
:where(.atui, .atui-swarm) .flow-decision { position: absolute; display: grid; place-items: center; text-align: center;
  background: var(--instr-tint); border: 1.5px solid var(--instr); color: var(--instr-deep);
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); font-weight: 700; font-size: calc(11.5px * var(--af-text-scale)); padding: 0 18px; box-shadow: var(--shadow-sm); }
:where(.atui, .atui-swarm) .flow-decision span { max-width: 70px; line-height: 1.15; }
:where(.atui, .atui-swarm) .flow-merge { position: absolute; display: grid; place-items: center; background: var(--paper-2); border: 1.5px solid var(--line);
  border-radius: 999px; color: var(--ink-soft); font-weight: 700; font-size: calc(11.5px * var(--af-text-scale)); }
:where(.atui, .atui-swarm) .flow-cap { position: absolute; display: grid; place-items: center; background: var(--ink); color: var(--paper);
  border-radius: 999px; font-weight: 700; font-size: calc(11px * var(--af-text-scale)); letter-spacing: .04em; text-transform: uppercase; }
:where(.atui, .atui-swarm) .flow-cap.end { background: var(--answer-deep); }

/* edge variants */
:where(.atui, .atui-swarm) .swarm-edge.loop { stroke: var(--accent, var(--rust)); stroke-dasharray: 5 6; }
:where(.atui, .atui-swarm) .swarm-edge.taken { stroke: var(--instr-deep); stroke-width: 2.8; stroke-dasharray: none; animation: none; }
:where(.atui, .atui-swarm) .swarm-edge.dim { stroke: var(--line); opacity: .7; animation: none; }
:where(.atui, .atui-swarm) .swarm-edge-head.taken { fill: var(--instr-deep); }
:where(.atui, .atui-swarm) .swarm-edge-head.dim { fill: var(--line); }

/* team time-travel + notepad + commentary */
:where(.atui, .atui-swarm) .swarm-spacer { flex: 1; }
:where(.atui, .atui-swarm) .swarm-np-toggle { border: 1px solid var(--line); background: var(--paper-2); color: var(--ink); border-radius: 9px; padding: 5px 11px; font-weight: 700; font-size: calc(12.5px * var(--af-text-scale)); cursor: pointer; }
:where(.atui, .atui-swarm) .swarm-body { flex: 1; min-height: 0; display: flex; gap: 16px; padding-bottom: 16px; }
:where(.atui, .atui-swarm) .swarm-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.atui-swarm .timeline { margin-top: 12px; flex: none; }
:where(.atui, .atui-swarm) .swarm-commentary { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex: none; font-size: calc(13px * var(--af-text-scale)); color: var(--ink-soft); }
:where(.atui, .atui-swarm) .swarm-commentary b { color: var(--ink); }
:where(.atui, .atui-swarm) .swarm-commentary .sc-sep { color: var(--ink-faint); }
:where(.atui, .atui-swarm) .swarm-notepad { width: 320px; flex: none; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-sm); overflow: hidden; }
:where(.atui, .atui-swarm) .swarm-np-head { font-family: var(--font-display); font-weight: 700; font-size: calc(14px * var(--af-text-scale)); padding: 14px 16px 8px; }
:where(.atui, .atui-swarm) .agent-card.future { opacity: .48; }
:where(.atui, .atui-swarm) .agent-card.current { border-color: var(--accent); box-shadow: var(--shadow-md); }

/* ============================================================
   Accessibility — visible keyboard focus + reduced-motion.
   (Added for full keyboard/AT support; pointer users are unaffected.)
   ============================================================ */
.atui :focus-visible, .atui-swarm :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; border-radius: 8px; }
/* the timeline scrubber is a focusable role="slider" */
:where(.atui, .atui-swarm) .tl-track { outline: none; }
:where(.atui, .atui-swarm) .tl-track:focus-visible { outline: 2px solid var(--rust); outline-offset: 4px; border-radius: 8px; }

@media (prefers-reduced-motion: reduce) {
  .atui *, .atui-swarm * {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

/* per-step token attribution (input / output / cache-read) under the cost row */
:where(.atui, .atui-swarm) .cost-breakdown { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: calc(12px * var(--af-text-scale)); color: var(--ink-soft, #6E5C49); }
:where(.atui, .atui-swarm) .cost-breakdown .cb-item { display: inline-flex; align-items: center; gap: 5px; }
:where(.atui, .atui-swarm) .cost-breakdown .cb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--call); }
:where(.atui, .atui-swarm) .cost-breakdown .cb-dot.in { background: var(--data); }
:where(.atui, .atui-swarm) .cost-breakdown .cb-dot.out { background: var(--instr); }
:where(.atui, .atui-swarm) .cost-breakdown .cb-item.cached { color: var(--answer-deep, var(--answer)); font-weight: 600; }

/* truncation note for oversized tool I/O in the inspector code panes */
.atui .code-trunc, .atui-swarm .code-trunc { color: var(--ink-faint); font-style: italic; }

/* host deep-link affordances (only render when a linkResolver is supplied) */
:where(.atui, .atui-swarm) .insp-link { margin-left: auto; margin-right: 8px; font-size: calc(12px * var(--af-text-scale)); font-weight: 700; color: var(--rust); text-decoration: none; white-space: nowrap; }
:where(.atui, .atui-swarm) .insp-link:hover { text-decoration: underline; }
:where(.atui-swarm) .agent-card .ac-extlink { position: absolute; top: 8px; right: 9px; font-size: 13px; line-height: 1; color: var(--ink-faint); cursor: pointer; padding: 2px; border-radius: 6px; }
:where(.atui-swarm) .agent-card .ac-extlink:hover { color: var(--rust); background: var(--rust-tint); }

/* host-supplied per-step detail slot (renderDetail) — sits under the inspector sections */
:where(.atui, .atui-swarm) .insp-extra { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }

/* ─────────────────────────────────────────────────────────────────────────
   <BacktrackView> — the "why?" board. All rules scoped under .atui-backtrack
   (no host leakage), reading the same theme variables as the player.
   Beat reveal: the scene carries cumulative classes s1..s4. */
.atui-backtrack, :where(.atui-backtrack) * { box-sizing: border-box; }
.atui-backtrack {
  font-family: var(--font-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line-soft); border-radius: var(--r-xl, 18px);
  box-shadow: var(--shadow-md);
  /* no overflow:hidden — it would break the sticky stepper (a clipping
     ancestor becomes the sticky containing scrollport); the bar and the
     stepper round their own corners instead */
}
:where(.atui-backtrack) button { font-family: inherit; cursor: pointer; }
:where(.atui-backtrack) :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
:where(.atui-backtrack) code { font-family: var(--font-mono); font-size: .92em; background: var(--paper-2); border: 1px solid var(--line-soft); border-radius: 5px; padding: 0 4px; }

/* top bar */
:where(.atui-backtrack) .bt-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); background: var(--card); border-radius: var(--r-xl, 18px) var(--r-xl, 18px) 0 0; }
:where(.atui-backtrack) .bt-brand { font-family: var(--font-display); font-weight: 800; font-size: calc(13px * var(--af-text-scale)); color: var(--rust-deep); }
:where(.atui-backtrack) .bt-why { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 800; font-size: calc(13px * var(--af-text-scale)); color: var(--error-deep); text-transform: uppercase; letter-spacing: .06em; }
:where(.atui-backtrack) .bt-why .rec { width: 8px; height: 8px; border-radius: 50%; background: var(--error); animation: bt-blink 1.6s ease-in-out infinite; }
@keyframes bt-blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
:where(.atui-backtrack) .bt-claim { flex: 1; min-width: 0; font-size: calc(13.5px * var(--af-text-scale)); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:where(.atui-backtrack) .bt-mode { font-family: var(--font-mono); font-size: calc(10.5px * var(--af-text-scale)); padding: 3px 9px; border-radius: 999px; background: var(--call-tint); color: var(--call-deep); border: 1px solid var(--line-soft); white-space: nowrap; }
:where(.atui-backtrack) .bt-mode.causal { background: var(--answer-tint); color: var(--answer-deep); }

/* scene column */
:where(.atui-backtrack) .bt-scene { max-width: 880px; margin: 0 auto; padding: 22px 22px 10px; }
:where(.atui-backtrack) .bt-kicker { font-family: var(--font-display); font-size: calc(10.5px * var(--af-text-scale)); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--error-deep); margin-bottom: 4px; }

/* beat 0 — the answer under investigation */
:where(.atui-backtrack) .bt-answer { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1.5px solid var(--error); border-radius: var(--r-lg, 14px); padding: 14px 16px; box-shadow: var(--shadow-sm); }
:where(.atui-backtrack) .bt-x { flex: 0 0 auto; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--error); color: #fff; font-weight: 800; font-size: 14px; }
:where(.atui-backtrack) .bt-answer-text { font-size: calc(14.5px * var(--af-text-scale)); line-height: 1.45; }

/* beat 1 — who answered */
:where(.atui-backtrack) .bt-brainblock, :where(.atui-backtrack) .bt-suspectblock, :where(.atui-backtrack) .bt-folded, :where(.atui-backtrack) .bt-culprit, :where(.atui-backtrack) .bt-honesty { opacity: 0; transform: translateY(8px); transition: opacity .45s ease, transform .45s ease; }
:where(.atui-backtrack) .bt-scene.s1 .bt-brainblock,
:where(.atui-backtrack) .bt-scene.s2 .bt-suspectblock,
:where(.atui-backtrack) .bt-scene.s2 .bt-folded,
:where(.atui-backtrack) .bt-scene.s3 .bt-honesty,
:where(.atui-backtrack) .bt-scene.final .bt-culprit { opacity: 1; transform: none; }
:where(.atui-backtrack) .bt-uplink { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; }
:where(.atui-backtrack) .bt-upstem { width: 2px; height: 16px; background: var(--line); }
:where(.atui-backtrack) .bt-upchip { font-family: var(--font-mono); font-size: calc(11px * var(--af-text-scale)); color: var(--ink-soft); }
:where(.atui-backtrack) .bt-brainrow { display: flex; align-items: center; gap: 16px; justify-content: center; padding: 6px 0 2px; }
:where(.atui-backtrack) .bt-brainfig { transform: scale(.62); transform-origin: center; margin: -16px -18px; }
:where(.atui-backtrack) .bt-brainnote { max-width: 430px; font-size: calc(13.5px * var(--af-text-scale)); line-height: 1.45; color: var(--ink-soft); }
:where(.atui-backtrack) .bt-brainnote b { color: var(--ink); }

/* beat 2 — the suspects (the provable candidate set) */
:where(.atui-backtrack) .bt-suspects { display: flex; gap: 14px; align-items: stretch; margin-top: 2px; }
:where(.atui-backtrack) .bt-suspect { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; transition: opacity .4s ease, filter .4s ease; }
:where(.atui-backtrack) .bt-stemwrap { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-bottom: 4px; }
:where(.atui-backtrack) .bt-stem { width: 3px; height: 22px; background: var(--line); border-radius: 2px; }
:where(.atui-backtrack) .bt-suspect.confirmed .bt-stem { background: var(--error); }
:where(.atui-backtrack) .bt-edge { font-family: var(--font-mono); font-size: calc(10px * var(--af-text-scale)); color: var(--ink-faint); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
:where(.atui-backtrack) .bt-edge.is-control { color: var(--instr-deep); }
:where(.atui-backtrack) .bt-su-card { position: relative; flex: 1; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r-md, 12px); padding: 12px 13px 14px; box-shadow: var(--shadow-sm); }
:where(.atui-backtrack) .bt-suspect.confirmed .bt-su-card { border-color: var(--error); box-shadow: 0 0 0 3px var(--error-tint), var(--shadow-sm); }
:where(.atui-backtrack) .bt-suspect.cleared { opacity: .55; filter: saturate(.6); }
:where(.atui-backtrack) .bt-su-head { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
:where(.atui-backtrack) .bt-su-rank { font-family: var(--font-mono); font-size: calc(10.5px * var(--af-text-scale)); color: var(--ink-faint); }
:where(.atui-backtrack) .bt-su-kind { font-family: var(--font-display); font-size: calc(10px * var(--af-text-scale)); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px; background: var(--instr-tint); color: var(--instr-deep); }
:where(.atui-backtrack) .bt-su-kind.k-tool { background: var(--call-tint); color: var(--call-deep); }
:where(.atui-backtrack) .bt-su-kind.k-stage, :where(.atui-backtrack) .bt-su-kind.k-arg { background: var(--paper-2); color: var(--ink-soft); }
:where(.atui-backtrack) .bt-su-name { font-family: var(--font-mono); font-weight: 700; font-size: calc(12.5px * var(--af-text-scale)); margin-bottom: 6px; }
:where(.atui-backtrack) .bt-su-text { font-size: calc(12px * var(--af-text-scale)); line-height: 1.4; color: var(--ink-soft); margin-bottom: 9px; }
/* the influence meter — the track is always the full 100%; the colored
   fill + value OVERLAY it and only land on "the scores" beat (s3) */
:where(.atui-backtrack) .bt-meter { position: relative; height: 16px; border-radius: 9px; background: var(--paper-2); border: 1px solid var(--line-soft); overflow: hidden; margin-bottom: 7px; }
:where(.atui-backtrack) .bt-meter .bt-fill { position: absolute; inset: 0 auto 0 0; border-radius: 8px; transform: scaleX(0); transform-origin: left; transition: transform .7s ease; }
:where(.atui-backtrack) .bt-scene.s3 .bt-meter .bt-fill { transform: scaleX(1); }
:where(.atui-backtrack) .bt-meter.hot .bt-fill { background: var(--error); }
:where(.atui-backtrack) .bt-meter.warm .bt-fill { background: var(--instr); }
:where(.atui-backtrack) .bt-meter.cool .bt-fill { background: var(--call); }
/* path-only upper bound: hatched fill — a 1.0 that isn't evidence */
:where(.atui-backtrack) .bt-meter.ub .bt-fill { background: repeating-linear-gradient(45deg, var(--paper-2), var(--paper-2) 4px, var(--line) 4px, var(--line) 7px); opacity: .6; }
:where(.atui-backtrack) .bt-meter-val { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-weight: 700; font-size: calc(9.5px * var(--af-text-scale)); padding: 0 5px; border-radius: 6px; background: rgba(255, 255, 255, .82); color: var(--ink-soft); opacity: 0; transition: opacity .45s ease .25s; }
:where(.atui-backtrack) .bt-scene.s3 .bt-meter-val { opacity: 1; }
:where(.atui-backtrack) .bt-meter.hot .bt-meter-val { color: var(--error-deep); }
:where(.atui-backtrack) .bt-meter.warm .bt-meter-val { color: var(--instr-deep); }
:where(.atui-backtrack) .bt-meter.ub .bt-meter-val { color: var(--ink-faint); }
:where(.atui-backtrack) .bt-su-born { font-size: calc(11px * var(--af-text-scale)); color: var(--ink-faint); }
:where(.atui-backtrack) .bt-stamp { display: inline-block; margin-top: 9px; padding: 3px 10px; border: 2px solid var(--error); border-radius: 7px; color: var(--error-deep); background: var(--error-tint); font-family: var(--font-display); font-weight: 800; font-size: calc(11.5px * var(--af-text-scale)); letter-spacing: .04em; transform: rotate(-3deg); animation: bt-stamp-in .35s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes bt-stamp-in { from { transform: rotate(-3deg) scale(1.6); opacity: 0; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }
:where(.atui-backtrack) .bt-cleared-tag { display: inline-block; margin-top: 9px; font-family: var(--font-mono); font-size: calc(10.5px * var(--af-text-scale)); color: var(--ink-faint); }
:where(.atui-backtrack) .bt-folded { margin-top: 10px; text-align: center; font-family: var(--font-mono); font-size: calc(10.5px * var(--af-text-scale)); color: var(--ink-faint); }

/* beat 4 — the culprit's chain of custody */
:where(.atui-backtrack) .bt-culprit { margin-top: 16px; background: var(--card); border: 1.5px solid var(--error); border-radius: var(--r-lg, 14px); padding: 14px 16px; box-shadow: var(--shadow-sm); }
:where(.atui-backtrack) .bt-cu-head { font-family: var(--font-display); font-size: calc(13.5px * var(--af-text-scale)); margin-bottom: 8px; }
:where(.atui-backtrack) .bt-custody { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
:where(.atui-backtrack) .bt-scene.final .bt-custody li { display: flex; gap: 10px; align-items: baseline; opacity: 0; animation: bt-hop-in .4s ease forwards; }
@keyframes bt-hop-in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
:where(.atui-backtrack) .bt-cu-step { flex: 0 0 84px; font-family: var(--font-display); font-size: calc(10.5px * var(--af-text-scale)); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--rust-deep); text-align: right; }
:where(.atui-backtrack) .bt-cu-detail { font-size: calc(12.5px * var(--af-text-scale)); line-height: 1.4; color: var(--ink-soft); }
:where(.atui-backtrack) .bt-cu-detail code { color: var(--ink); }
:where(.atui-backtrack) .bt-cu-claim { border-top: 1px dashed var(--line); padding-top: 9px; font-size: calc(12.5px * var(--af-text-scale)); font-weight: 600; color: var(--error-deep); }

/* honesty footer — the report's claims discipline, verbatim */
:where(.atui-backtrack) .bt-honesty { margin-top: 14px; display: flex; flex-direction: column; gap: 3px; border-top: 1px dashed var(--line); padding-top: 10px; }
:where(.atui-backtrack) .bt-h-line { font-family: var(--font-mono); font-size: calc(10.5px * var(--af-text-scale)); color: var(--ink-faint); line-height: 1.5; }

/* beat stepper */
:where(.atui-backtrack) .bt-stepper { display: flex; align-items: flex-start; justify-content: center; gap: 14px; padding: 12px 16px 14px; border-top: 1px solid var(--line-soft); background: var(--card); margin-top: 14px; position: sticky; bottom: 0; z-index: 5; border-radius: 0 0 var(--r-xl, 18px) var(--r-xl, 18px); box-shadow: 0 -8px 18px -12px rgba(44, 31, 21, .35); }
:where(.atui-backtrack) .bt-nav { border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); width: 26px; height: 26px; border-radius: 50%; font-size: 15px; line-height: 1; }
:where(.atui-backtrack) .bt-nav:disabled { opacity: .35; cursor: default; }
:where(.atui-backtrack) .bt-dot { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; padding: 2px 4px; }
:where(.atui-backtrack) .bt-dot-i { width: 10px; height: 10px; border-radius: 50%; background: var(--paper-2); border: 1.5px solid var(--line); transition: background .25s ease, border-color .25s ease; }
:where(.atui-backtrack) .bt-dot.past .bt-dot-i { background: var(--rust-tint); border-color: var(--rust); }
:where(.atui-backtrack) .bt-dot.on .bt-dot-i { background: var(--rust); border-color: var(--rust-deep); }
:where(.atui-backtrack) .bt-dot-label { font-family: var(--font-display); font-size: calc(10px * var(--af-text-scale)); font-weight: 700; color: var(--ink-faint); white-space: nowrap; }
:where(.atui-backtrack) .bt-dot.on .bt-dot-label { color: var(--rust-deep); }

/* narrow screens: suspects stack */
@media (max-width: 640px) {
  :where(.atui-backtrack) .bt-suspects { flex-direction: column; }
  :where(.atui-backtrack) .bt-stemwrap { flex-direction: row; justify-content: center; }
  :where(.atui-backtrack) .bt-stem { width: 22px !important; height: 3px; }
}

/* BacktrackView — decision-point variants + the rewind player */
/* a "?" decision (mid-loop choice) instead of a ✕ bug */
:where(.atui-backtrack) .bt-answer.tone-question { border-color: var(--instr); }
:where(.atui-backtrack) .bt-answer.tone-question .bt-x { background: var(--instr); }
:where(.atui-backtrack) .bt-answer.tone-question .bt-kicker { color: var(--instr-deep); }

/* deterministic decider — the decision diamond (decide()/if-on-tool-result) */
:where(.atui-backtrack) .bt-diamond { width: 64px; height: 64px; margin: 14px 16px; transform: rotate(45deg); border-radius: 12px;
  background: linear-gradient(155deg, var(--instr-tint), var(--instr)); border: 2.5px solid #fff;
  display: grid; place-items: center; filter: drop-shadow(0 8px 16px rgba(150,70,30,.18)); }
:where(.atui-backtrack) .bt-diamond span { transform: rotate(-45deg); font-family: var(--font-display); font-weight: 800;
  font-size: 26px; color: var(--instr-deep); }

/* full hop chain on a suspect card (multi-hop paths, control hops labeled) */
:where(.atui-backtrack) .bt-su-path { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
:where(.atui-backtrack) .bt-hop { font-family: var(--font-mono); font-size: calc(10px * var(--af-text-scale)); color: var(--ink-faint); line-height: 1.45; }
:where(.atui-backtrack) .bt-hop.is-control { color: var(--instr-deep); }

/* the exact-trail variant of the custody card (no causal claim — recorded hops) */
:where(.atui-backtrack) .bt-culprit.tone-exact { border-color: var(--instr); }
:where(.atui-backtrack) .bt-culprit.tone-exact .bt-cu-step { color: var(--instr-deep); }
:where(.atui-backtrack) .bt-culprit.tone-exact .bt-cu-claim { color: var(--ink-soft); }

/* custody rows double as the rewind scrubber when they carry recorded state */
:where(.atui-backtrack) .bt-custody li.has-evidence { cursor: pointer; border-radius: 8px; margin: 0 -6px; padding: 2px 6px; }
:where(.atui-backtrack) .bt-custody li.has-evidence:hover { background: var(--paper-2); }
:where(.atui-backtrack) .bt-custody li.sel { background: var(--paper-2); }
:where(.atui-backtrack) .bt-cu-eye { color: var(--rust); font-weight: 700; }

/* the rewind pane — the actual recorded state at the selected hop */
:where(.atui-backtrack) .bt-rewind { margin: 4px 0 10px; border: 1px solid var(--line-soft); border-radius: var(--r-md, 12px); overflow: hidden; }
:where(.atui-backtrack) .bt-rw-bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--paper-2); border-bottom: 1px solid var(--line-soft); }
:where(.atui-backtrack) .bt-rw-label { font-family: var(--font-display); font-size: calc(10.5px * var(--af-text-scale)); font-weight: 800; letter-spacing: .04em; color: var(--rust-deep); white-space: nowrap; }
:where(.atui-backtrack) .bt-rw-where { flex: 1; min-width: 0; font-size: calc(11px * var(--af-text-scale)); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:where(.atui-backtrack) .bt-rw-nav { display: flex; gap: 4px; }
:where(.atui-backtrack) .bt-rw-nav button { border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); width: 22px; height: 22px; border-radius: 50%; font-size: 13px; line-height: 1; }
:where(.atui-backtrack) .bt-rw-nav button:disabled { opacity: .35; cursor: default; }
:where(.atui-backtrack) .bt-evidence { margin: 0; padding: 12px 14px; background: var(--code-bg); color: var(--code-ink);
  font-family: var(--font-mono); font-size: calc(11.5px * var(--af-text-scale)); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
:where(.atui-backtrack) .bt-mark { background: var(--error-tint); color: var(--error-deep); border-bottom: 2px solid var(--error); border-radius: 3px; padding: 0 2px; font-weight: 700; }

/* suspects pagination — real slices carry many suspects */
:where(.atui-backtrack) .bt-su-pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-bottom: 6px; }
:where(.atui-backtrack) .bt-su-count { font-family: var(--font-mono); font-size: calc(10.5px * var(--af-text-scale)); color: var(--ink-faint); }

/* score-tie note — rides inside the suspect block, lands with the scores */
:where(.atui-backtrack) .bt-sc-note { margin-top: 10px; text-align: center; font-size: calc(11.5px * var(--af-text-scale)); color: var(--ink-soft); opacity: 0; transition: opacity .45s ease; }
:where(.atui-backtrack) .bt-scene.s3 .bt-sc-note { opacity: 1; }

/* <BacktrackOverlay> — desktop modal / mobile full-screen with back nav */
.atui-backtrack-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(30, 20, 12, .45); display: grid; place-items: center; padding: 26px; }
:where(.atui-backtrack-overlay) .bto-sheet { width: min(960px, 100%); max-height: 92vh; overflow: auto; border-radius: 18px; background: #FFFDFA; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
:where(.atui-backtrack-overlay) .bto-bar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; padding: 7px 10px; background: rgba(255, 253, 250, .94); border-bottom: 1px solid rgba(0, 0, 0, .07); backdrop-filter: blur(3px); }
:where(.atui-backtrack-overlay) .bto-back { border: none; background: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 13px; color: #95380F; padding: 4px 8px; border-radius: 8px; }
:where(.atui-backtrack-overlay) .bto-back:hover { background: rgba(192, 83, 31, .1); }
/* inside the sheet the board sheds its own card chrome */
:where(.atui-backtrack-overlay) .atui-backtrack { border: none; box-shadow: none; border-radius: 0; }
:where(.atui-backtrack-overlay) .atui-backtrack .bt-bar { border-radius: 0; }
:where(.atui-backtrack-overlay) .atui-backtrack .bt-stepper { border-radius: 0; }
@media (max-width: 640px) {
  .atui-backtrack-overlay { padding: 0; }
  :where(.atui-backtrack-overlay) .bto-sheet { width: 100%; height: 100dvh; max-height: none; border-radius: 0; }
}

/* Where did this come from? — variable chips (the onBacktrack seam) */
:where(.atui, .atui-swarm) .var-chips { display: flex; flex-wrap: wrap; gap: 6px; }
:where(.atui, .atui-swarm) .var-chip {
  font-family: var(--font-mono); font-size: calc(11px * var(--af-text-scale));
  padding: 3px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
  transition: border-color 120ms, color 120ms, background 120ms;
}
:where(.atui, .atui-swarm) .var-chip:hover {
  border-color: var(--accent); color: var(--ink);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
}

/* ============================================================
   <InfluenceMap> — "what influenced this answer, and what happens
   without it?" All rules scoped under .atui-influence. Colours/fonts
   only via the theme vars; dark mode comes free through theme.mode.
   ============================================================ */
.atui-influence, :where(.atui-influence) * { box-sizing: border-box; }
.atui-influence {
  font-family: var(--font-body); color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: var(--r-xl, 18px);
  box-shadow: var(--shadow-md); overflow: hidden;
}
:where(.atui-influence) button { font-family: inherit; cursor: pointer; }
:where(.atui-influence) :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
:where(.atui-influence) .inf-node-hit:focus:not(:focus-visible),
:where(.atui-influence) .inf-toggle:focus:not(:focus-visible) { outline: none; }

:where(.atui-influence) code { font-family: var(--font-mono); font-size: .92em; background: var(--paper-2); border: 1px solid var(--line-soft); border-radius: 5px; padding: 0 4px; }

/* header bar */
:where(.atui-influence) .inf-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); background: var(--card); }
:where(.atui-influence) .inf-brand { font-family: var(--font-display); font-weight: 800; font-size: calc(13px * var(--af-text-scale)); color: var(--rust-deep); }
:where(.atui-influence) .inf-title { font-family: var(--font-display); font-weight: 800; font-size: calc(13px * var(--af-text-scale)); color: var(--rust); text-transform: uppercase; letter-spacing: .06em; }
:where(.atui-influence) .inf-question { flex: 1; min-width: 0; font-size: calc(13.5px * var(--af-text-scale)); color: var(--ink-soft); }

/* strategy selector — same skeleton as the Why panel's scorer tabs */
:where(.atui-influence) .inf-strat-wrap { padding: 12px 16px 0; }
:where(.atui-influence) .inf-strats { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 8px; }
:where(.atui-influence) .inf-strat {
  font-family: var(--font-body); font-size: calc(11.5px * var(--af-text-scale)); font-weight: 700;
  color: var(--ink-soft); background: var(--paper-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 4px 12px; cursor: pointer;
}
:where(.atui-influence) .inf-strat.on { background: var(--card); color: var(--rust); border-color: var(--rust); box-shadow: var(--shadow-sm); }
:where(.atui-influence) .inf-strat.off { color: var(--ink-faint); background: transparent; border-style: dashed; cursor: not-allowed; opacity: .75; }
:where(.atui-influence) .inf-sub { font-size: calc(11px * var(--af-text-scale)); color: var(--ink-faint); margin-bottom: 4px; line-height: 1.4; }
/* strategy selector as a native dropdown (strategyControl="dropdown") */
:where(.atui-influence) .inf-strat-select {
  font-family: var(--font-body); font-size: calc(12px * var(--af-text-scale)); font-weight: 700;
  color: var(--rust); background: var(--card); border: 1px solid var(--rust);
  border-radius: 8px; padding: 5px 30px 5px 12px; margin: 0 0 6px; max-width: 100%;
  cursor: pointer; box-shadow: var(--shadow-sm);
  -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--rust) 50%), linear-gradient(135deg, var(--rust) 50%, transparent 50%);
  background-position: right 14px center, right 9px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}

/* the radial map */
:where(.atui-influence) .inf-stage { padding: 10px 16px 4px; }
:where(.atui-influence) .inf-svg { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; overflow: visible; }
:where(.atui-influence) .inf-edge { stroke: var(--ink-faint); }
:where(.atui-influence) .inf-answer-c { fill: var(--rust-tint); stroke: var(--rust); stroke-width: 2; }
:where(.atui-influence) .inf-answer-label { font-family: var(--font-display); font-weight: 800; font-size: 15px; fill: var(--rust-deep); }
:where(.atui-influence) .inf-node-hit { cursor: pointer; }
:where(.atui-influence) .inf-node-c { fill: var(--call-tint); stroke: var(--call); stroke-width: 1.5; transition: stroke-width .15s; }
:where(.atui-influence) .inf-node.sel .inf-node-c { stroke: var(--rust); stroke-width: 3; }
:where(.atui-influence) .inf-meter-arc { stroke: var(--call-deep); stroke-width: 3; stroke-linecap: round; opacity: .85; }
:where(.atui-influence) .inf-node-label { font-family: var(--font-body); font-weight: 700; font-size: 11px; fill: var(--ink-soft); }
:where(.atui-influence) .inf-node.sel .inf-node-label { fill: var(--rust-deep); }
/* ignored nodes read as struck-out */
:where(.atui-influence) .inf-node.ignored .inf-node-c { fill: transparent; stroke: var(--ink-faint); stroke-dasharray: 4 3; opacity: .55; }
:where(.atui-influence) .inf-node.ignored .inf-meter-arc { opacity: .25; }
:where(.atui-influence) .inf-node.ignored .inf-node-label { fill: var(--ink-faint); text-decoration: line-through; }
/* per-node ignore toggle */
:where(.atui-influence) .inf-toggle { cursor: pointer; }
:where(.atui-influence) .inf-toggle-c { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
:where(.atui-influence) .inf-toggle:hover .inf-toggle-c { stroke: var(--rust); }
:where(.atui-influence) .inf-node.ignored .inf-toggle-c { fill: var(--rust-tint); stroke: var(--rust); }
:where(.atui-influence) .inf-toggle-i { font-family: var(--font-body); font-weight: 800; font-size: 12px; fill: var(--ink-soft); }

/* the answer under the centre node */

var DATA = {"app":{"id":"trip","title":"The trip advisor","tagline":"should I hike it? — with visible reasons","assistantLabel":"Guide","accent":"#2E7D4F","accentDark":"#1E5C38","entityLabel":"Trail","entityDefault":"Mission Peak","starters":["Should I hike Mission Peak on Saturday?","What about \"Mount Tamalpais\"?"],"driver":"weather_forecast","tools":[{"name":"weather_forecast","legendLabel":"weather","description":"Saturday's forecast for a place — condition, high temperature and rain chance (Open-Meteo, keyless).","alwaysSynthetic":false},{"name":"wiki_place","legendLabel":"place","description":"What a place is — a one-paragraph description (Wikipedia, keyless).","alwaysSynthetic":false},{"name":"crowd_level","legendLabel":"crowd","description":"How busy a trail tends to be on a Saturday morning — a MODELED estimate, not measured data.","alwaysSynthetic":true}]},"model":"claude-haiku-4-5-20251001","custody":[[{"b":"Your key stays in this tab."}],[{"t":"This is a live public demo — it runs entirely in your browser. Your key goes only to Anthropic; this site’s host (GitHub Pages) never receives it."}],[{"t":"Every Claude call goes straight from your browser to "},{"code":"api.anthropic.com"},{"t":" — our demo server never sees your key. It is not sent to us, not logged, not put in any URL, and not stored unless you tick “remember”, which keeps it in this tab only until you close it. "},{"b":"Forget my key"},{"t":" erases it instantly."}],[{"t":"This page doesn’t even need our server: it is a plain static file — any dumb file host can serve it, and it chats just the same. That is the guarantee: there is no server code that "},{"em":"could"},{"t":" see your key."}],[{"b":"Don’t take our word for it"},{"t":" — open DevTools → Network and watch: the only requests that carry your key go to "},{"code":"api.anthropic.com"},{"t":". Everything else is weather, Wikipedia and iTunes, called keylessly from your browser."}]],"footer":[[{"t":"Runs on your key: each reply is a handful of small Haiku calls (one per source the agent consults, plus one to answer); a verified what-if re-run is a few more, replayed over the "},{"b":"frozen"},{"t":" tool results of the original turn — zero new fetches, and the counter on the re-run card proves it. Usage appears in your Anthropic console like any other API traffic."}]],"checkboxLabel":"Remember my key in this tab (survives reload and the trip back to the gallery; forgotten when the tab closes)","leaveConfirm":"Leaving resets this conversation — your key stays per your “remember” choice."};
var MODEL = DATA.model;
var APP = DATA.app;
// One desk per page: the visitor picked it on the gallery home, so there is no
// cross-desk state here at all — only this pack, and its own fork tabs.
var PACKS = [PACK];

// ─── generated from lib/page.js — do not hand-edit in a page shell ──────────
// The legend's plain-words vocabulary, its state→dot paint, and the legend
// component itself all come from here, so the desk pages and the BYOK page
// render the SAME DOM with the SAME classes.
// PROV_HELP stays in both modes — the legend's own tooltips are built from the
// same explanations, and a tooltip is runtime (it names THIS reply's verdict).
var PROV_HELP = [{"state":"live","label":"live","what":"real data fetched from the internet just now (this source really answered)"},{"state":"fallback","label":"fallback","what":"we tried the real source but couldn’t reach it, so the demo used realistic stand-in data — and says so"},{"state":"synthetic","label":"synthetic (never measured)","what":"data that is invented by design (like the crowd estimate); it is always labeled, never passed off as real"},{"state":"not consulted","label":"not consulted","what":"the assistant didn’t use this source for this reply"}];
var PROV_CLOSING = "Every tool sentence carries its own [source: …] label — the map never hides where data came from.";
var PROV_DOT_CLASS = {"live":"live","scripted":"scripted","fallback":"fallback","synthetic":"synthetic","not consulted":"notconsulted","replay":"replay"};
var PROV_WORDS = {};
PROV_HELP.forEach(function (h) { PROV_WORDS[h.state] = h.what; });

/** THE state→class function. Every dot on the page is painted through it. */
function provDotClass(state) {
  return 'cd-dot ' + (PROV_DOT_CLASS[state] || 'unknown');
}

/** THE dot element. One call site shape ⇒ the legend row and the dialog agree. */
function provDot(state) {
  return React.createElement('span', { className: provDotClass(state) });
}

/**
 * "live: real data fetched from the internet just now (…)" — no tool name.
 *
 * @param detail  the sentence's OWN "[source: …]" text for THIS turn, when the
 *   turn recorded one (lib/mcp.js sourceLabelsFromToolLog). The verdict is the
 *   word; this is the reason behind it — "synthetic fallback — HTTP 404" — and
 *   without it a hollow fallback dot is a dead end for anyone not reading code.
 */
function provBody(tool, p, detail) {
  var body = p
    ? p + (PROV_WORDS[p] ? ': ' + PROV_WORDS[p] : '')
    : 'not used yet: waiting for the first reply';
  if (tool.alwaysSynthetic && p !== 'synthetic') {
    body += ' · this source is always synthetic by design — modeled, never measured';
  }
  if (detail) body += ' · this reply: ' + detail;
  return body;
}

APP.tools.forEach(function (t) { TOOL_LABEL[t.name] = t.legendLabel || t.name.replace(/_/g, ' '); });
function plainTool(name) { return TOOL_LABEL[name] || String(name).replace(/_/g, ' '); }

var LIVE = null;
var SET_LIVE = null;
var LAST_STREAM = null;

function paint() {
  if (!SET_LIVE) return;
  SET_LIVE(LIVE ? { userMessage: LIVE.userMessage, status: LIVE.status, text: LIVE.text } : null);
}

var scrollPending = false;
function scrollDown() {
  if (scrollPending) return;
  scrollPending = true;
  window.requestAnimationFrame(function () {
    scrollPending = false;
    var el = document.querySelector('.cd-scroll');
    if (el) el.scrollTop = el.scrollHeight;
  });
}

// Display pacing only (lib/page.js's pacer, duplicated per the freeze-and-copy
// convention): statuses show in ARRIVAL order, each with a minimum display floor
// of STATUS_HOLD_MS. retire() — the first token — stops further statuses and
// lets the one on screen finish its floor while the reply streams underneath;
// clear() — the committed turn — drops everything. Reduced motion → floor 0.
var PACER = {
  queue: [], timer: null, busy: false, shownAt: 0,
  push: function (s) {
    if (LAST_STREAM) LAST_STREAM.statuses.push(s);
    PACER.queue.push(s);
    if (!PACER.busy) {
      if (PACER.timer) { clearTimeout(PACER.timer); PACER.timer = null; }
      PACER.pump();
    }
  },
  pump: function () {
    if (!PACER.queue.length) { PACER.busy = false; PACER.timer = null; return; }
    PACER.busy = true;
    var s = PACER.queue.shift();
    if (LIVE) { LIVE.status = s; PACER.shownAt = Date.now(); paint(); }
    PACER.timer = setTimeout(PACER.pump, STATUS_HOLD_MS);
  },
  retire: function () {
    PACER.queue = []; PACER.busy = false;
    if (PACER.timer) { clearTimeout(PACER.timer); PACER.timer = null; }
    var left = Math.max(0, STATUS_HOLD_MS - (Date.now() - PACER.shownAt));
    if (left === 0) { if (LIVE) LIVE.status = null; return; }
    PACER.timer = setTimeout(function () {
      PACER.timer = null;
      if (LIVE) { LIVE.status = null; paint(); }
    }, left);
  },
  clear: function () {
    PACER.queue = []; PACER.busy = false;
    if (PACER.timer) clearTimeout(PACER.timer);
    PACER.timer = null;
  },
};

/** One raw agentfootprint event → at most one UI effect. Real events only. */
function makeLiveSink() {
  var nameOf = {};        // toolCallId → toolName, learned on tool_start
  var sawToken = false;
  return function (ev) {
    var p = ev.payload || {};
    if (ev.type === 'agentfootprint.stream.llm_start') {
      if (LIVE) { LIVE.text = ''; sawToken = false; }
      PACER.push({ kind: 'thinking', label: 'thinking…' });
    } else if (ev.type === 'agentfootprint.stream.tool_start') {
      nameOf[p.toolCallId] = p.toolName;
      PACER.push({ kind: 'tool', tool: p.toolName, label: 'consulting ' + plainTool(p.toolName) + '…' });
    } else if (ev.type === 'agentfootprint.stream.tool_end' && p.error) {
      var name = nameOf[p.toolCallId] || 'a source';
      PACER.push({ kind: 'tool', tool: name, label: plainTool(name) + ' hit an error — answering without it' });
    } else if (ev.type === 'agentfootprint.stream.token') {
      if (LAST_STREAM) LAST_STREAM.tokenCount += 1;
      if (!LIVE) return;
      if (!sawToken) { sawToken = true; PACER.retire(); }
      LIVE.text += (p.content == null ? '' : p.content);
      if (!REDUCED) { paint(); scrollDown(); }
    }
  };
}

/** Render one rich-text line of the custody copy. */
function richLine(segs, key) {
  return e('p', { key: key }, segs.map(function (s, i) {
    if (s.b !== undefined) return e('strong', { key: i }, s.b);
    if (s.code !== undefined) return e('code', { key: i }, s.code);
    if (s.em !== undefined) return e('em', { key: i }, s.em);
    return s.t;
  }));
}

/** Depth-safe stringify for the leak check — cycles become '[circular]'. */
function safeStringify(value) {
  var seen = new WeakSet();
  return JSON.stringify(value, function (k, v) {
    if (typeof v === 'object' && v !== null) {
      if (seen.has(v)) return '[circular]';
      seen.add(v);
    }
    if (typeof v === 'function') return '[function]';
    if (v instanceof Map) return Array.from(v.entries());
    return v;
  });
}

function Byok() {
  var d0 = React.useState(INITIAL); var desk = d0[0], setDesk = d0[1];
  var a0 = React.useState(!!storedKey()); var armed = a0[0], setArmed = a0[1];
  var t0 = React.useState(''); var tail = t0[0], setTail = t0[1];
  var r0 = React.useState(false); var remember = r0[0], setRemember = r0[1];
  var i0 = React.useState(''); var input = i0[0], setInput = i0[1];
  // The in-flight turn — user bubble at once, then the honest status row, then
  // the reply writing itself from Anthropic's own arrival cadence.
  var v0 = React.useState(null); var liveTurn = v0[0], setLiveTurn = v0[1];
  SET_LIVE = setLiveTurn;
  var keyRef = React.useRef(null);
  // Which turn the reason panel is showing, tracked in a ref as well as in
  // state: a re-run fired in the same tick as the reason that opened the panel
  // would otherwise read a render-old panelKey and silently do nothing.
  var panelRef = React.useRef(null);

  // A key remembered for this tab auto-arms on load (that is the whole point of
  // the checkbox: surviving an accidental mid-demo reload).
  React.useEffect(function () {
    var k = storedKey();
    if (k) { apiKey = k; keyTail = k.slice(-4); setArmed(true); setTail(keyTail); setRemember(true); }
  }, []);

  var sess = desk.sessions[desk.active];

  function patch(fn) {
    setDesk(function (d) { return fn(Object.assign({}, d)); });
  }

  // ═══ leaving for the gallery ════════════════════════════════════════════
  // The "← gallery" link is a real same-tab navigation, and this page's memory
  // is the conversation: every turn and every fork lives in the tab, nowhere
  // else. So the trip is never blocked and never silent — once there is
  // something to lose, the visitor is asked, and the same sentence names what
  // happens to their key (sessionStorage if they ticked "remember", gone if
  // they didn't). Before the first message there is nothing to lose and the
  // link just goes.
  function hasConversation() {
    if (LIVE) return true;
    return desk.order.some(function (id) {
      var s = desk.sessions[id];
      return !!(s && ((s.turns && s.turns.length) || (s.seed && s.seed.length)));
    });
  }
  function onLeave(ev) {
    if (!hasConversation()) return;
    if (!window.confirm(DATA.leaveConfirm)) ev.preventDefault();
  }

  // Failures are shown, never swallowed — and never posted anywhere: there is no
  // telemetry on this page. Anthropic's own error bodies do not echo keys, and
  // the raw line is kept after the plain-words lead so a visitor can still see
  // exactly what the API said.
  function closePanel() {
    panelRef.current = null;
    patch(function (d) { d.panelKey = null; return d; });
  }
  var fail = function (err) {
    var raw = String((err && err.message) || err);
    var status = err && err.status;
    var lead = null;
    if (status === 401 || /401|authentication_error|invalid x-api-key/.test(raw)) {
      lead = 'Anthropic rejected that key (401 — invalid x-api-key). Check it and paste it again. '
        + 'Nothing was stored, and the key went nowhere except api.anthropic.com.';
    } else if (status === 429 || /429|rate_limit/.test(raw)) {
      lead = 'Anthropic is rate-limiting this key (429). Wait a moment and send again.';
    } else if (status === 400 && /credit|billing/i.test(raw)) {
      lead = 'Anthropic will not run this key right now (billing or credit). Check your Anthropic console.';
    } else if (/Failed to fetch|NetworkError|load failed/i.test(raw)) {
      lead = 'The call to api.anthropic.com could not be made — check the network. Your key never left this tab.';
    }
    window.alert(lead ? lead + '\n\n(Anthropic said: ' + raw + ')' : raw);
  };

  // ═══ arming / forgetting ════════════════════════════════════════════════
  function arm() {
    var el = keyRef.current;
    var k = el && el.value ? el.value.trim() : '';
    if (!k) { window.alert('Paste your Anthropic API key first.'); return; }
    apiKey = k;
    keyTail = k.slice(-4);
    if (remember) rememberKey(k); else eraseStoredKey();
    if (el) el.value = '';           // the key string leaves the DOM immediately
    setArmed(true);
    setTail(keyTail);
  }
  function forget() {
    apiKey = null;
    keyTail = '';
    eraseStoredKey();
    if (keyRef.current) keyRef.current.value = '';
    setArmed(false);
    setTail('');
    setRemember(false);
  }

  // ═══ the four calls — local functions, no HTTP, no server ═══════════════
  function send(explicit) {
    var msg = (typeof explicit === 'string' ? explicit : input).trim();
    // Guard on the KEY, not on React's armed flag: apiKey is the module-scope
    // variable that actually enables a call, and unlike a rendered flag it is
    // never one render behind. (armed still drives the disabled composer.)
    if (!msg || !apiKey) return;
    if (LIVE) return;                    // one in-flight turn per page
    setInput('');
    LIVE = { userMessage: msg, status: null, text: '' };
    LAST_STREAM = { statuses: [], tokenCount: 0, finalReceived: false };
    paint(); scrollDown();
    var done = function () { PACER.clear(); LIVE = null; paint(); };
    return api.chat({ appId: APP.id, sessionId: desk.active, message: msg, onEvent: makeLiveSink() }).then(function (j) {
      LAST_STREAM.finalReceived = true;
      done();
      patch(function (d) {
        var sessions = Object.assign({}, d.sessions);
        var s = Object.assign({}, sessions[j.sessionId]);
        // The debug payload came back with the reply, from the turn's own
        // recording — computed in this tab, never requested, never stored.
        s.turns = s.turns.concat([{ index: j.turnIndex, userMessage: msg, reply: j.reply,
          provenance: j.provenance, sourceLabels: j.sourceLabels || null, entity: j.entity,
          debug: j.debug || null }]);
        if (j.entity) s.entity = j.entity;
        sessions[j.sessionId] = s;
        d.sessions = sessions;
        if (d.order.indexOf(j.sessionId) === -1) d.order = d.order.concat([j.sessionId]);
        d.active = j.sessionId;
        return d;
      });
      return j;
    }).catch(function (err) { done(); return fail(err); });
  }

  function openReason(sid, ti) {
    var key = sid + ':' + ti;
    return api.reason({ appId: APP.id, sessionId: sid, turnIndex: ti }).then(function (j) {
      panelRef.current = key;
      patch(function (d) {
        d.reason = Object.assign({}, d.reason);
        d.reason[key] = { map: j.map, strategies: j.strategies };
        d.panelKey = key;
        return d;
      });
      return j;
    }).catch(fail);
  }

  function doRerun(ids) {
    var key = desk.panelKey || panelRef.current;
    if (!key) return;
    var parts = key.split(':'), sid = parts[0], ti = Number(parts[1]);
    var before = metrics.toolDispatches;
    return api.rerunTurn({ appId: APP.id, sessionId: sid, turnIndex: ti, ignore: ids }).then(function (j) {
      var dispatched = metrics.toolDispatches - before;
      patch(function (d) {
        d.reruns = Object.assign({}, d.reruns);
        d.reruns[key] = { rerunId: j.rerunId, ignoredIds: ids, ignoredLabels: j.ignoredLabels,
          result: j.result, dispatched: dispatched };
        return d;
      });
      return j.result;   // the af RerunWithoutSourcesResult, verbatim, for atui's own panel
    }).catch(fail);
  }

  function doFork(sid, ti, rerunId) {
    return api.fork({ appId: APP.id, sessionId: sid, turnIndex: ti, rerunId: rerunId }).then(function (j) {
      panelRef.current = null;
      patch(function (d) {
        d.sessions = Object.assign({}, d.sessions);
        d.sessions[j.sessionId] = { id: j.sessionId, label: j.label, forkOf: j.forkOf || null,
          ignoredSourceIds: j.ignoredSourceIds, seed: j.transcript, entity: j.entity || null, turns: [] };
        if (d.order.indexOf(j.sessionId) === -1) d.order = d.order.concat([j.sessionId]);
        d.active = j.sessionId;
        d.panelKey = null;
        return d;
      });
      return j;
    }).catch(fail);
  }

  // A real test seam (not theater): the exact handlers, callable headless.
  // It exposes the key's LAST FOUR characters at most — never the key.
  window.__byok = {
    appId: APP.id,
    arm: arm, forget: forget,
    isArmed: function () { return armed; },
    keyTail: function () { return tail; },
    send: function (m) { setInput(m); return send(m); },
    reason: openReason, rerun: doRerun, fork: doFork,
    // The guard's own inputs, so a drive can prove WHEN it fires, not just that
    // a dialog appeared: false before the first message, true after it lands.
    hasConversation: hasConversation,
    getState: function () { return { appId: APP.id, desk: desk, armed: armed, tail: tail }; },
    // What the last send really saw on the in-tab event channel.
    get lastStream() { return LAST_STREAM; },
    // Everything the page holds, deep-serialized — the assertion that the key
    // never entered the recorded state, run against real bytes.
    dump: function () {
      var sessions = [];
      core.sessions.forEach(function (s) {
        sessions.push({ id: s.id, appId: s.appId, meta: s.meta, data: core.sessionToData(s),
          turns: s.chat.turns, reruns: Array.from(s.reruns.entries()) });
      });
      return safeStringify({ ui: { appId: APP.id, desk: desk, tail: tail }, sessions: sessions });
    },
  };

  // ═══ the thread ═════════════════════════════════════════════════════════
  var thread = [];
  if (sess) {
    parseSeed(sess.seed || [], APP.assistantLabel).forEach(function (m, i) {
      var cls = (m.role === 'user' ? 'msg-user' : 'msg-advisor') + ' seed';
      thread.push(m.role === 'user'
        ? e('div', { key: 'seed' + i, className: cls }, m.text)
        : e('div', { key: 'seed' + i, className: cls, dangerouslySetInnerHTML: md(m.text) }));
    });
    (sess.turns || []).forEach(function (t) {
      var key = desk.active + ':' + t.index;
      thread.push(e('div', { key: 'u' + t.index, className: 'msg-user' }, t.userMessage));
      thread.push(e('div', { key: 'a' + t.index, className: 'msg-advisor', 'data-testid': 'reply-' + key,
        dangerouslySetInnerHTML: md(t.reply) }));
      thread.push(e('button', { key: 'rb' + t.index, className: 'cd-reasonbtn', 'data-testid': 'reason-' + key,
        onClick: function () { openReason(desk.active, t.index); } }, 'visible reason'));
      var wf = desk.reruns[key];
      if (wf) {
        var verdict = wf.result && wf.result.verdict;
        var chip = verdict
          ? e('span', { className: 'chip ' + verdict.verdict }, verdict.verdict + ' — ' + verdict.claim)
          : e('span', { className: 'chip observed' }, 'observed only (no baseline check)');
        thread.push(e('div', { key: 'wf' + t.index, className: 'whatif', 'data-testid': 'whatif-' + key },
          e('p', { className: 'whatif-lbl' }, 'without ' + (wf.ignoredLabels || wf.ignoredIds).join(', ')
            + ', I would have said: (tool results frozen at the original run)'),
          e('div', { className: 'whatif-ans', dangerouslySetInnerHTML: md(wf.result.answer) }),
          chip,
          e('p', { className: 'whatif-sum' }, wf.result.whatChanged.summary),
          e('p', { className: 'whatif-frozen', 'data-testid': 'dispatches-' + key },
            wf.dispatched + ' new tool fetches during this re-run — the original turn\u2019s tool results were replayed'),
          e('button', { className: 'cd-fork', 'data-testid': 'fork-' + key,
            onClick: function () { doFork(desk.active, t.index, wf.rerunId); } }, 'Continue from this version')));
      }
    });
    if (liveTurn) {
      thread.push(e('div', { key: 'live-u', className: 'msg-user' }, liveTurn.userMessage));
      if (liveTurn.status) {
        thread.push(e('div', { key: 'live-s', className: 'cd-status', 'data-testid': 'live-status' },
          e('span', { className: 'cd-pulse' }), liveTurn.status.label));
      }
      if (liveTurn.text) {
        thread.push(e('div', { key: 'live-a', className: 'msg-advisor', 'data-testid': 'reply-live',
          dangerouslySetInnerHTML: md(liveTurn.text) }));
      }
    }
  }

  // Session tabs — the original conversation and every fork of it. There are no
  // cross-desk tabs: the other desk is its own page, one click back through the
  // gallery.
  var tabs = desk.order.map(function (id) {
    return e('button', { key: id, className: 'cd-tab' + (id === desk.active ? ' on' : ''), 'data-testid': 'tab-' + id,
      onClick: function () { panelRef.current = null; patch(function (d) { d.active = id; d.panelKey = null; return d; }); } },
      desk.sessions[id] ? desk.sessions[id].label : id);
  });

  var prov = sess && sess.forkOf
    ? e('p', { className: 'cd-prov' }, 'continued from the turn-' + (sess.forkOf.turnIndex + 1) + ' what-if · '
        + (sess.ignoredSourceIds || []).join(', ') + ' stays ignored for every later turn')
    : null;

  // The newest turn that recorded a verdict map drives the dots — and the same
  // shared ProvLegend the desk pages render draws them (see lib/page.js).
  // The verdict and its reason come off the SAME turn — never a word from one
  // reply explained by another reply's label.
  var lastProv = null;
  var lastLabels = null;
  var tks = (sess && sess.turns) || [];
  for (var li = tks.length - 1; li >= 0; li -= 1) {
    if (tks[li].provenance) { lastProv = tks[li].provenance; lastLabels = tks[li].sourceLabels || null; break; }
  }
  var legend = e(ProvLegend, {
    entityLabel: APP.entityLabel,
    entityValue: (sess && sess.entity) || APP.entityDefault,
    tools: APP.tools,
    provenance: lastProv,
    sourceLabels: lastLabels,
  });

  // ═══ custody panel / armed strip ════════════════════════════════════════
  var custody = armed
    ? e('div', { className: 'by-armed', 'data-testid': 'byok-armed' },
        e('span', null, 'key …' + tail + ' — in this tab'),
        // The armed strip answers the same question the checkbox asked, now that
        // the answer matters: this desk is one link away from the gallery.
        e('span', { className: 'by-armed-note' },
          remember
            ? 'remembered until you close this tab — the gallery and the other desk keep it'
            : 'kept in this page only — going back to the gallery clears it'),
        e('button', { 'data-testid': 'byok-forget', onClick: forget }, 'Forget my key'))
    : e('div', { className: 'by-custody', 'data-testid': 'byok-custody' },
        e('h2', null, 'Bring your own key'),
        e('div', { className: 'by-copy' }, DATA.custody.map(function (line, i) { return richLine(line, 'c' + i); })),
        // NO <form> element: no submit default, so nothing here can ever turn
        // into a GET navigation that puts a key in a URL.
        e('div', { className: 'by-form' },
          e('input', { type: 'password', autoComplete: 'off', spellCheck: 'false', ref: keyRef,
            'data-testid': 'byok-key', placeholder: 'sk-ant-…  (stays in this tab)',
            onKeyDown: function (ev) { if (ev.key === 'Enter') arm(); } }),
          e('button', { 'data-testid': 'byok-arm', onClick: arm }, 'Start chatting'),
          e('label', { className: 'by-remember' },
            e('input', { type: 'checkbox', 'data-testid': 'byok-remember', checked: remember,
              onChange: function (ev) { setRemember(ev.target.checked); } }),
            DATA.checkboxLabel)));

  var badgeText = MODEL + ' — direct from your browser · ' + (armed ? 'key …' + tail + ' in this tab' : 'no key yet');
  var badge = e('span', { className: 'cd-model' + (armed ? ' live' : ''), 'data-testid': 'model-badge',
    title: 'Every request from this page goes straight to api.anthropic.com with this model id' },
    e('span', { className: 'cd-dot ' + (armed ? 'live' : 'scripted') }), badgeText);

  var panelOpen = !!(desk.panelKey && desk.reason[desk.panelKey]);
  var panelInner = panelOpen
    ? e(InfluenceMap, { key: desk.panelKey, map: desk.reason[desk.panelKey].map,
        strategies: desk.reason[desk.panelKey].strategies,
        activeStrategy: desk.reason[desk.panelKey].map.rankedBy, onRerun: doRerun,
        view: 'bars', strategyControl: 'dropdown', brand: APP.title })
    : null;

  var hasContent = sess && ((sess.turns && sess.turns.length) || (sess.seed && sess.seed.length) || liveTurn);
  var conversation = hasContent
    ? e('div', { className: 'cd-thread' }, thread)
    : e('div', { className: 'cd-empty-hint' }, armed
        ? 'Ask a question to begin. Every reply carries a “visible reason” button — tap it to see, as a ranked bar list, exactly which sources shaped the answer.'
        : 'Paste your Anthropic key above to start. Nothing is sent anywhere until you do.');

  return e('div', { className: 'cd-app' + (panelOpen ? ' panel-open' : ''),
      style: { '--accent': APP.accent, '--accent-dk': APP.accentDark } },
    e('div', { className: 'cd-main' },
      e('div', { className: 'cd-bar' },
        // './index.html' — the bundle's own gallery home, one folder level, no
        // origin and no base path, so it resolves under /visible-reasoning/, at
        // a domain root and off file:// alike. SAME TAB on purpose: the gallery
        // is where the visitor came from and where the other desk is. The cost
        // of that (this page's memory is the conversation) is not hidden — see
        // onLeave: once there is something to lose, it asks first.
        e('a', { className: 'cd-back', href: './index.html', onClick: onLeave,
          'data-testid': 'back-to-gallery' }, '← gallery'),
        e('span', { className: 'cd-brand' }, 'Bring your own key ', e('span', { className: 'cd-mark' }, '·'), ' ', APP.title),
        e('span', { className: 'cd-tagline' }, APP.tagline),
        badge,
        // One small control; everything it opens lives inside the dialog.
        e(DebugControl, { turns: (sess && sess.turns) || [] }),
        e('div', { className: 'cd-tabs' }, tabs)),
      e('div', { className: 'cd-scroll' },
        e('div', { className: 'cd-col' },
          custody,
          legend,
          prov,
          conversation,
          e('div', { className: 'by-foot', 'data-testid': 'byok-footer' },
            DATA.footer.map(function (line, i) { return richLine(line, 'f' + i); })))),
      e('div', { className: 'cd-composer' },
        e('div', { className: 'cd-composer-col' },
          e('div', { className: 'cd-inputrow' },
            e('input', { 'data-testid': 'chat-input', value: input, disabled: !armed || !!liveTurn,
              placeholder: armed ? APP.starters[0] : 'Paste your Anthropic key above to start',
              onChange: function (ev) { setInput(ev.target.value); },
              onKeyDown: function (ev) { if (ev.key === 'Enter') send(); } }),
            e('button', { 'data-testid': 'chat-send', disabled: !armed || !!liveTurn, onClick: send }, 'Send'))))),
    e('div', { className: 'cd-panel' + (panelOpen ? ' open' : ''), 'data-testid': 'reason-panel' },
      e('div', { className: 'cd-panel-head' },
        e('span', { className: 'cd-panel-title' }, 'Visible reason'),
        e('button', { className: 'cd-panel-close', 'aria-label': 'close', onClick: closePanel }, '×')),
      e('div', { className: 'cd-panel-body' }, panelInner)),
    e('div', { className: 'cd-backdrop' + (panelOpen ? ' show' : ''), onClick: closePanel }));
}

ReactDOMClient.createRoot(document.getElementById('root')).render(e(Byok));

</script>
